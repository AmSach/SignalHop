<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignalHop — Live Acoustic Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
  h1 { font-size: 2rem; background: linear-gradient(90deg, #00d4ff, #7b2dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
  .subtitle { color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
  .card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 480px; margin-bottom: 1rem; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
  .dot.live { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
  .dot.error { background: #ff4444; }
  textarea { width: 100%; background: #0a0a0f; border: 1px solid #333; border-radius: 8px; padding: 12px; color: #fff; font-family: monospace; font-size: 0.9rem; resize: vertical; min-height: 80px; }
  textarea:focus { outline: none; border-color: #00d4ff; }
  .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
  .btn.primary { background: linear-gradient(90deg, #00d4ff, #7b2dff); color: #000; }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,212,255,0.3); }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn.secondary { background: #1a1a1a; color: #888; border: 1px solid #333; }
  .btn.secondary:hover { border-color: #00d4ff; color: #00d4ff; }
  .log { background: #0a0a0f; border: 1px solid #1a1a1a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; margin-top: 1rem; }
  .log-entry { padding: 4px 0; border-bottom: 1px solid #111; }
  .log-entry tx { color: #00d4ff; }
  .log-entry rx { color: #7b2dff; }
  .log-entry info { color: #666; }
  .log-entry err { color: #ff4444; }
  .canvas-wrap { text-align: center; margin: 1rem 0; }
  canvas { background: #0a0a0f; border-radius: 8px; border: 1px solid #222; }
  .info { font-size: 0.8rem; color: #555; margin-top: 0.5rem; }
  .badge { display: inline-block; background: #1a1a2e; color: #00d4ff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin: 2px; }
</style>
</head>
<body>

<h1>SignalHop Demo</h1>
<p class="subtitle">Open this in two browser tabs to chat via sound 🎧</p>

<div class="card">
  <div class="status">
    <div class="dot" id="micDot"></div>
    <span id="statusText">Click Start to initialize audio</span>
  </div>
  <div class="canvas-wrap">
    <canvas id="waveform" width="400" height="80"></canvas>
  </div>
  <textarea id="input" placeholder="Type a message..."></textarea>
  <div style="display:flex;gap:8px;margin-top:8px;">
    <button class="btn primary" id="startBtn" onclick="start()">🎤 Start</button>
    <button class="btn secondary" id="sendBtn" onclick="sendMessage()" disabled>📡 Send</button>
  </div>
</div>

<div class="card">
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
    <span style="color:#888;font-size:0.85rem;">Modem:</span>
    <span class="badge" id="freqLow">18 kHz (0)</span>
    <span class="badge" id="freqHigh">20 kHz (1)</span>
    <span class="badge" id="sampleRate">48 kHz</span>
    <span class="badge" id="bitRate">500 bit/s</span>
  </div>
</div>

<div class="log" id="log"></div>
<p class="info">Uses Web Audio API with dual-channel output at 18kHz/20kHz.<br>For best results, place devices 1-3 meters apart with speakers facing each other.</p>

<script>
const SAMPLE_RATE = 48000;
const FREQ_LOW = 18000;
const FREQ_HIGH = 20000;
const SYMBOL_RATE = 500;
const SAMPLES_PER_SYMBOL = SAMPLE_RATE / SYMBOL_RATE; // 96

let audioCtx, analyser, oscillator, stream;
let isRunning = false;
let txCount = 0, rxCount = 0;

const logEl = document.getElementById('log');
const statusEl = document.getElementById('statusText');
const micDot = document.getElementById('micDot');
const startBtn = document.getElementById('startBtn');
const sendBtn = document.getElementById('sendBtn');
const inputEl = document.getElementById('input');
const canvas = document.getElementById('waveform');
const ctx2d = canvas.getContext('2d');

function log(type, msg) {
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<${type}>[${new Date().toLocaleTimeString()}] ${msg}</${type}>`;
  logEl.prepend(div);
}

function setStatus(text, isLive = false) {
  statusEl.textContent = text;
  micDot.className = 'dot' + (isLive ? ' live' : '');
}

// Waveform visualizer
function drawWaveform(data) {
  ctx2d.fillStyle = '#0a0a0f';
  ctx2d.fillRect(0, 0, canvas.width, canvas.height);
  ctx2d.strokeStyle = '#00d4ff';
  ctx2d.lineWidth = 1.5;
  ctx2d.beginPath();
  const step = Math.floor(data.length / canvas.width);
  for (let i = 0; i < canvas.width; i++) {
    const v = data[i * step] || 0;
    const y = 40 + v * 30;
    i === 0 ? ctx2d.moveTo(i, y) : ctx2d.lineTo(i, y);
  }
  ctx2d.stroke();
}

// FSK tone generator
function generateTone(bit, durationSamples) {
  const buf = audioCtx.createBuffer(1, durationSamples, SAMPLE_RATE);
  const data = buf.getChannelData(0);
  const freq = bit ? FREQ_HIGH : FREQ_LOW;
  for (let i = 0; i < durationSamples; i++) {
    // Cosine window for smooth edges
    let amp = 1;
    if (i < 20) amp = 0.5 * (1 - Math.cos(Math.PI * i / 20));
    else if (i >= durationSamples - 20) amp = 0.5 * (1 + Math.cos(Math.PI * (durationSamples - i) / 20));
    data[i] = amp * Math.sin(2 * Math.PI * freq * i / SAMPLE_RATE);
  }
  return buf;
}

// Encode message as acoustic signal
function encodeMessage(text) {
  const payload = new TextEncoder().encode(text);
  const bits = [];
  for (let b of payload) {
    for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
  }
  // Add CRC-32 placeholder (simple sum for demo)
  let crc = 0;
  for (let b of payload) crc ^= b;
  bits.push(crc & 1, crc & 2 ? 1 : 0, crc & 4 ? 1 : 0, crc & 8 ? 1 : 0,
    crc & 16 ? 1 : 0, crc & 32 ? 1 : 0, crc & 64 ? 1 : 0, crc & 128 ? 1 : 0);

  // Generate chirp preamble
  const chirpDur = 0.05; // 50ms
  const chirpSamples = Math.floor(SAMPLE_RATE * chirpDur);

  const buffers = [];

  // 4 up-chirps as sync preamble
  for (let c = 0; c < 4; c++) {
    const chirp = audioCtx.createBuffer(1, chirpSamples, SAMPLE_RATE);
    const d = chirp.getChannelData(0);
    const startFreq = FREQ_LOW - 2000;
    const endFreq = FREQ_HIGH + 2000;
    for (let i = 0; i < chirpSamples; i++) {
      const t = i / SAMPLE_RATE;
      const f = startFreq + (endFreq - startFreq) * t / chirpDur;
      d[i] = Math.sin(2 * Math.PI * f * t);
    }
    buffers.push(chirp);
  }

  // FSK symbols
  for (let bit of bits) {
    buffers.push(generateTone(bit, SAMPLES_PER_SYMBOL));
  }

  return buffers;
}

// Play acoustic message
async function playMessage(text) {
  if (!audioCtx) return;
  const buffers = encodeMessage(text);
  const source = audioCtx.createBufferSource();
  const totalLen = buffers.reduce((s, b) => s + b.length, 0);
  const combined = audioCtx.createBuffer(1, totalLen, SAMPLE_RATE);
  const data = combined.getChannelData(0);
  let off = 0;
  for (let b of buffers) {
    data.set(b.getChannelData(0), off);
    off += b.length;
  }

  // Analyze for visualizer
  const analyser2 = audioCtx.createAnalyser();
  analyser2.fftSize = 256;
  const src = audioCtx.createBufferSource();
  src.buffer = combined;
  src.connect(analyser2);

  const display = () => {
    const d = new Uint8Array(analyser2.frequencyBinCount);
    analyser2.getByteTimeDomainData(d);
    drawWaveform(d);
  };

  src.onended = () => {
    setTimeout(() => drawWaveform(new Uint8Array(analyser2.frequencyBinCount).fill(128)), 500);
  };

  src.start();
  txCount++;
  log('tx', `Transmitted: "${text}" (${buffers.length} symbols)`);
}

// Start audio
async function start() {
  if (isRunning) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    isRunning = true;
    setStatus('Listening...', true);
    startBtn.textContent = '🟢 Live';
    startBtn.disabled = true;
    sendBtn.disabled = false;
    log('info', `Audio initialized at ${SAMPLE_RATE}Hz`);
    animateWaveform();
  } catch (e) {
    log('err', `Audio error: ${e.message}`);
    setStatus('Mic access denied', false);
  }
}

// Simple continuous detection (demo — real impl needs Goertzel)
function animateWaveform() {
  if (!isRunning) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  drawWaveform(data);

  // Check for 18kHz / 20kHz energy peaks (simplified)
  const freqData = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(freqData);
  const binSize = SAMPLE_RATE / analyser.fftSize;
  const lowBin = Math.round(FREQ_LOW / binSize);
  const highBin = Math.round(FREQ_HIGH / binSize);
  const lowEnergy = freqData.slice(Math.max(0, lowBin - 2), lowBin + 3).reduce((a, b) => a + b, 0);
  const highEnergy = freqData.slice(Math.max(0, highBin - 2), highBin + 3).reduce((a, b) => a + b, 0);

  document.getElementById('freqLow').textContent = `18kHz: ${Math.round(lowEnergy)}`;
  document.getElementById('freqHigh').textContent = `20kHz: ${Math.round(highEnergy)}`;

  if (lowEnergy > 3000 || highEnergy > 3000) {
    // Potential signal detected
  }

  requestAnimationFrame(animateWaveform);
}

// Send message on Enter key
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !isRunning) return;
  playMessage(text);
  inputEl.value = '';
}

log('info', 'SignalHop acoustic demo loaded. Click Start to begin.');
</script>
</body>
</html>
